<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#211538" />
      <stop offset="50%" stop-color="#121024" />
      <stop offset="100%" stop-color="#090814" />
    </radialGradient>

    <!-- Hot Pink Glow -->
    <radialGradient id="pinkGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#EA4C89" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EA4C89" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1B30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121122" stop-opacity="0.95" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4C89" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="200" r="400" fill="url(#pinkGlow)" />
  <circle cx="950" cy="450" r="450" fill="url(#cyanGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="250" y1="0" x2="250" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="550" y1="0" x2="550" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="850" y1="0" x2="850" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- Left: Minimal Editorial Typography -->
  <g transform="translate(100, 150)">
    <!-- Brand Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="36" rx="18" fill="#EA4C89" fill-opacity="0.15" stroke="#EA4C89" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#EA4C89" />
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#EA4C89" letter-spacing="1">PERSONAL SHOWCASE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
      Landing<tspan fill="#EA4C89">Vault</tspan>
    </text>

    <!-- Subtitle / Creator Attribution -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9E9EA7">
      Crafted &amp; Curated by <tspan fill="#FFFFFF" font-weight="600">Rajat Debnath</tspan>
    </text>

    <!-- Value Props Badges -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#F3F4F6">
        ✦ 100% Live HTML &amp; CSS Fidelity
      </text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#F3F4F6">
        ✦ Zero Database • Instant Previews
      </text>
      <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#F3F4F6">
        ✦ Responsive Viewport Testing
      </text>
    </g>

    <!-- Link -->
    <g transform="translate(0, 320)">
      <rect width="240" height="42" rx="21" fill="#FFFFFF" />
      <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0D0C22">Explore Library →</text>
    </g>
  </g>

  <!-- Right: Perspective Creative Visual Mockup Cards -->
  <g transform="translate(720, 100)">
    <!-- Back Card (Portfolio) -->
    <g transform="rotate(6) translate(60, 40)">
      <rect width="360" height="230" rx="16" fill="#151426" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />
      <rect x="0" y="0" width="360" height="28" rx="16" fill="#1C1B30" />
      <circle cx="20" cy="14" r="4" fill="#EA4C89" />
      <circle cx="34" cy="14" r="4" fill="#00F5FF" />
      <text x="28" y="100" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Elena Rostova</text>
      <text x="28" y="125" font-family="sans-serif" font-size="12" fill="#9E9EA7">Principal Design Systems &amp; OS</text>
    </g>

    <!-- Middle Card (Chronos Luxury) -->
    <g transform="rotate(-4) translate(-40, 130)">
      <rect width="370" height="240" rx="16" fill="#101018" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.7))" />
      <circle cx="280" cy="120" r="60" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4" />
      <text x="28" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="2">HOROLOGY</text>
      <text x="28" y="125" font-family="serif" font-size="28" font-weight="400" fill="#FFFFFF">CHRONOS</text>
      <text x="28" y="155" font-family="sans-serif" font-size="12" fill="#9E9EA7">Tourbillon Titanium Edition</text>
    </g>

    <!-- Front Card (Apex AI SaaS) -->
    <g transform="translate(0, 20)">
      <rect width="380" height="250" rx="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.85))" />
      <!-- Top header bar of card -->
      <line x1="0" y1="44" x2="380" y2="44" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
      <circle cx="24" cy="22" r="4.5" fill="#EA4C89" />
      <circle cx="40" cy="22" r="4.5" fill="#f59e0b" />
      <circle cx="56" cy="22" r="4.5" fill="#10b981" />
      <text x="320" y="27" font-family="monospace" font-size="11" fill="#EA4C89" font-weight="700">LIVE</text>

      <!-- Inside Card -->
      <g transform="translate(24, 68)">
        <rect width="64" height="22" rx="11" fill="#00F5FF" fill-opacity="0.15" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="15" font-family="sans-serif" font-size="10" font-weight="700" fill="#00F5FF">APEX AI</text>

        <text x="0" y="55" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Autonomous Intelligence</text>
        <text x="0" y="80" font-family="sans-serif" font-size="13" fill="#9E9EA7">Zero latency enterprise cognitive graphs.</text>

        <!-- Simulated code lines -->
        <g transform="translate(0, 105)" fill="#ffffff" fill-opacity="0.2">
          <rect width="180" height="8" rx="4" />
          <rect y="16" width="260" height="8" rx="4" />
          <rect y="32" width="120" height="8" rx="4" />
        </g>
      </g>
    </g>
  </g>
</svg>

